<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Головна — Synclone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Synclone</a>
    <div id="user-box"></div>
  </header>

  <main class="container">
    <h1>Особистий кабінет</h1>
    <p class="muted">Ваші бекапи свідомості (role: user)</p>

    <section class="stats" id="stats"></section>

    <section class="card">
      <h2>Додати бекап</h2>
      <form id="backup-form" class="form">
        <label>ID клона
          <input type="text" id="clone_id" required maxlength="100" placeholder="clone-042">
        </label>
        <label>Хеш пам'яті (>= 8 символів)
          <input type="text" id="memory_hash" required minlength="8" maxlength="128"
                 placeholder="sha256:...">
        </label>
        <label>Розмір, МБ
          <input type="number" id="size_mb" required min="1" max="1000000">
        </label>
        <button class="btn" type="submit">Створити</button>
        <p id="error" class="error" hidden></p>
      </form>
    </section>

    <section class="card">
      <h2>Мої бекапи</h2>
      <table>
        <thead>
          <tr><th>#</th><th>Клон</th><th>Хеш</th><th>МБ</th><th>Створено</th><th></th></tr>
        </thead>
        <tbody id="backup-rows"></tbody>
      </table>
      <p class="muted" id="empty" hidden>Бекапів ще немає.</p>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script>
    let me = null;

    async function loadStats() {
      const response = await api("/api/backups/stats");
      const stats = await response.json();
      document.getElementById("stats").innerHTML =
        '<div class="stat"><div class="value">' + stats.count +
        '</div><div class="label">бекапів</div></div>' +
        '<div class="stat"><div class="value">' + stats.total_size_mb +
        '</div><div class="label">МБ усього</div></div>';
    }

    async function loadBackups() {
      const response = await api("/api/backups");
      const rows = await response.json();
      const body = document.getElementById("backup-rows");
      document.getElementById("empty").hidden = rows.length !== 0;
      body.innerHTML = rows.map((b) =>
        "<tr><td>" + b.id + "</td><td>" + b.clone_id + "</td><td>" +
        b.memory_hash.slice(0, 18) + "…</td><td>" + b.size_mb + "</td><td>" +
        new Date(b.created_at).toLocaleString("uk-UA") +
        '</td><td><button class="btn btn-danger btn-small" data-id="' + b.id +
        '">Видалити</button></td></tr>'
      ).join("");
      body.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api("/api/backups/" + btn.dataset.id, { method: "DELETE" });
          await refresh();
        });
      });
    }

    async function refresh() {
      await Promise.all([loadStats(), loadBackups()]);
    }

    document.getElementById("backup-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorBox = document.getElementById("error");
      errorBox.hidden = true;
      const response = await api("/api/backups", {
        method: "POST",
        body: JSON.stringify({
          clone_id: document.getElementById("clone_id").value,
          memory_hash: document.getElementById("memory_hash").value,
          size_mb: Number(document.getElementById("size_mb").value),
        }),
      });
      if (!response.ok) {
        errorBox.textContent = "Помилка створення: HTTP " + response.status;
        errorBox.hidden = false;
        return;
      }
      event.target.reset();
      await refresh();
    });

    (async () => {
      me = await requireUser();
      if (me) {
        renderUserHeader(me);
        await refresh();
      }
    })();
  </script>
</body>
</html>
