<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація — Synclone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Synclone</a>
    <div><a href="/login.html">Увійти</a></div>
  </header>

  <main class="container">
    <section class="card" style="max-width: 420px; margin: 48px auto;">
      <h1>Реєстрація</h1>
      <p class="muted">Створюється акаунт звичайного користувача (роль user).
        Адміністратори створюються системою автоматично.</p>
      <form id="register-form" class="form">
        <label>Email
          <input type="email" id="email" required autocomplete="username">
        </label>
        <label>Пароль (від 8 символів)
          <input type="password" id="password" required minlength="8"
                 autocomplete="new-password">
        </label>
        <button class="btn" type="submit">Зареєструватись</button>
        <p id="error" class="error" hidden></p>
        <p id="ok" class="muted" hidden></p>
      </form>
      <p class="muted">Вже є акаунт? <a href="/login.html">Увійти</a></p>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorBox = document.getElementById("error");
      const okBox = document.getElementById("ok");
      errorBox.hidden = true;
      okBox.hidden = true;
      const response = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      if (response.status === 201) {
        okBox.textContent = "Готово! Перейдіть на сторінку входу.";
        okBox.hidden = false;
        setTimeout(() => { window.location.href = "/login.html"; }, 1200);
        return;
      }
      if (response.status === 409) {
        errorBox.textContent = "Такий email уже зареєстровано (409)";
      } else if (response.status === 422) {
        errorBox.textContent = "Невалідні дані: email та пароль (>= 8 символів)";
      } else {
        errorBox.textContent = "Помилка: HTTP " + response.status;
      }
      errorBox.hidden = false;
    });
  </script>
</body>
</html>
