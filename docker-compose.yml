version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: synclone_db
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: synclone_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    container_name: synclone_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/synclone_db
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: