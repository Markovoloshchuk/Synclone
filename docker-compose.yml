services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env.sandbox
    ports:
      - "5433:5432"
    volumes:
      - sandbox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    env_file:
      - .env.sandbox
    command: ["sh", "-c", "alembic upgrade head && python -m app.core.bootstrap_admin"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    env_file:
      - .env.sandbox
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sandbox_postgres_data:
    name: synclone_sandbox_postgres_data
